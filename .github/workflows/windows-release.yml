name: Windows signed release

on:
  push:
    tags:
      - "receiver-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing receiver-v* tag to build and release
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, verify, and publish win-x64
    runs-on: windows-latest
    timeout-minutes: 35
    environment: windows-code-signing
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve and verify release tag
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^receiver-v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use receiver-vMAJOR.MINOR.PATCH[-PRERELEASE]."
          }

          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "$tag is not an existing Git tag."
          }

          $tagCommit = (git rev-list -n 1 "refs/tags/$tag").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if (-not $tagCommit -or $tagCommit -ne $headCommit) {
            throw "The checked-out commit does not match $tag."
          }
          git show-ref --verify --quiet refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The origin/main ref was not fetched."
          }
          git merge-base --is-ancestor $headCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "$tag must identify a commit on main."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "head=$headCommit" >> $env:GITHUB_OUTPUT
          "archive=MBPhotosReceiver-$tag-win-x64.zip" >> $env:GITHUB_OUTPUT
          "checksums=MBPhotosReceiver-$tag-SHA256.txt" >> $env:GITHUB_OUTPUT

      - name: Require successful CI and an unused release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_COMMIT: ${{ steps.release.outputs.head }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists; published release assets are immutable."
          }

          $runsJson = gh run list `
            --repo $env:GITHUB_REPOSITORY `
            --workflow ci.yml `
            --commit $env:HEAD_COMMIT `
            --status success `
            --limit 1 `
            --json databaseId
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to verify the CI status for $env:HEAD_COMMIT."
          }
          $successfulRuns = @($runsJson | ConvertFrom-Json)
          if ($successfulRuns.Count -eq 0) {
            throw "The tagged commit must have a successful CI workflow run before signing."
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Restore, build, and test tagged source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore windows/MBPhotos.Windows.sln
          dotnet build windows/MBPhotos.Windows.sln --configuration Release --no-restore
          dotnet run --project windows/tests/MBPhotos.Receiver.Tests/MBPhotos.Receiver.Tests.csproj --configuration Release --no-build

      - name: Import certificate, publish, sign, and verify executable
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "mbphotos-signing.pfx"
          $certificate = $null
          $importedCertificates = @()

          try {
            if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
                [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
              throw "The protected Windows signing secrets are not configured."
            }

            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $securePassword = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
            $importedCertificates = @(
              Import-PfxCertificate `
                -FilePath $certificatePath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword `
                -Exportable:$false
            )
            Remove-Item $certificatePath -Force
            $securePassword.Dispose()
            $securePassword = $null
            Remove-Item Env:SIGNING_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:SIGNING_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue

            $certificate = $importedCertificates |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if (-not $certificate) {
              throw "The configured PFX did not contain a code-signing private key."
            }
            $now = Get-Date
            if ($certificate.NotBefore -gt $now -or $certificate.NotAfter -le $now) {
              throw "The configured code-signing certificate is not currently valid."
            }
            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $supportsCodeSigning = $certificate.EnhancedKeyUsageList |
              Where-Object { $_.ObjectId -eq $codeSigningOid }
            if (-not $supportsCodeSigning) {
              throw "The configured certificate is not authorized for code signing."
            }

            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe `
              -Recurse `
              -File |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "A Windows SDK x64 signtool.exe installation was not found."
            }
            $env:PATH = "$($signTool.Directory.FullName);$env:PATH"

            & ./windows/scripts/publish-signed.ps1 `
              -CertificateThumbprint $certificate.Thumbprint `
              -Configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw "Signed receiver publication failed."
            }
          }
          finally {
            foreach ($importedCertificate in $importedCertificates) {
              Remove-Item "Cert:\CurrentUser\My\$($importedCertificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Create portable archive and checksum
        id: package
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
          CHECKSUM_NAME: ${{ steps.release.outputs.checksums }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDirectory = Join-Path $PWD "artifacts\release"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null

          $archivePath = Join-Path $artifactDirectory $env:ARCHIVE_NAME
          Compress-Archive -Path "windows\artifacts\win-x64\*" -DestinationPath $archivePath -CompressionLevel Optimal

          $checksumPath = Join-Path $artifactDirectory $env:CHECKSUM_NAME
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($env:ARCHIVE_NAME)" | Set-Content -Path $checksumPath -Encoding ascii -NoNewline

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MBPhotosReceiver-signed-${{ steps.release.outputs.tag }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          MANUAL_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          $ErrorActionPreference = "Stop"
          $arguments = @(
            "release", "create", $env:RELEASE_TAG,
            $env:ARCHIVE_PATH, $env:CHECKSUM_PATH,
            "--verify-tag", "--generate-notes",
            "--title", "Marginally Better Photos Receiver $env:RELEASE_TAG"
          )
          if ($env:MANUAL_PRERELEASE -eq "true" -or $env:RELEASE_TAG -match '-') {
            $arguments += "--prerelease"
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed."
          }
