name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol v1 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Ruby for OpenAPI parsing
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Validate schemas, fixtures, OpenAPI, and path vectors
        run: |
          python3 protocol/scripts/validate.py
          python3 scripts/validate_protocol.py

  ios:
    name: iOS Swift 6 build and tests
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report selected toolchain
        run: |
          xcodebuild -version
          xcrun swiftc --version

      - name: Select and boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import re
          import sys

          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)(?:-(\d+))?", runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2) or 0))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ')"
          echo "udid=${simulator_udid}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "${simulator_udid}" 2>/dev/null || true
          xcrun simctl bootstatus "${simulator_udid}" -b

      - name: Build and test the checked-in Xcode project
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/MBPhotos.xcodeproj \
            -scheme MBPhotos \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/MBPhotosDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/MBPhotosTests.xcresult" \
            -maximum-parallel-testing-workers 1 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/MBPhotosTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows .NET 10 build and tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows solution
        run: dotnet restore windows/MBPhotos.Windows.sln

      - name: Build receiver and test runner
        run: dotnet build windows/MBPhotos.Windows.sln --configuration Release --no-restore

      - name: Run receiver integration tests
        run: dotnet run --project windows/tests/MBPhotos.Receiver.Tests/MBPhotos.Receiver.Tests.csproj --configuration Release --no-build

      - name: Publish unsigned self-contained receiver for packaging validation
        run: >-
          dotnet publish windows/src/MBPhotos.Receiver.Wpf/MBPhotos.Receiver.Wpf.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output "${{ runner.temp }}\MBPhotosReceiver-win-x64"

      - name: Upload unsigned CI receiver
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MBPhotosReceiver-unsigned-win-x64
          path: ${{ runner.temp }}\MBPhotosReceiver-win-x64
          if-no-files-found: error
          retention-days: 7
